[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "google-scholar-crawler"
version = "0.2.0"
description = "Google Scholar crawler that automates academic search in a real browser and hands the window to a human when Google asks for verification"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["google-scholar", "crawler", "playwright", "bibliometrics", "human-in-the-loop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "playwright>=1.49,<2",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.0,<7",
  # tomllib is stdlib from 3.11; the backport is the same reader under its old name
  "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
scholar-crawler = "scholar_crawler.cli:main"
scholar-digest = "scholar_crawler.digest:main"

[project.urls]
Homepage = "https://github.com/KimRasak/google-scholar-crawler"
Issues = "https://github.com/KimRasak/google-scholar-crawler/issues"

[tool.setuptools]
packages = ["scholar_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PTH", "ARG", "D"]
ignore = [
  "D203", # incompatible with D211
  "D213", # multi-line summary starts on the first line in this project
  "D401", # docstrings use noun phrases as often as imperatives
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "ARG001", "ARG002"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
